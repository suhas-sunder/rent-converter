<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,follow" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Page Not Found | RentConverter</title>
    <meta
      name="description"
      content="The requested RentConverter page could not be found."
    />
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f0f9ff;
        color: #334155;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      main {
        width: min(100%, 42rem);
        border-radius: 1.75rem;
        background: #fff;
        padding: clamp(2rem, 6vw, 4rem);
        text-align: center;
        box-shadow: 0 20px 50px rgb(14 116 144 / 0.08);
      }

      .eyebrow {
        margin: 0;
        color: #0369a1;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0.75rem 0 0;
        color: #0c4a6e;
        font-size: clamp(2.25rem, 8vw, 4rem);
        line-height: 1;
      }

      .message {
        margin: 1.25rem auto 0;
        max-width: 34rem;
        font-size: 1.05rem;
        line-height: 1.75;
      }

      a {
        display: inline-block;
        margin-top: 1.75rem;
        border-radius: 0.85rem;
        background: #0369a1;
        padding: 0.8rem 1.15rem;
        color: #fff;
        font-weight: 800;
        text-decoration: none;
      }

      a:hover {
        background: #075985;
      }

      a:focus-visible {
        outline: 3px solid #7dd3fc;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Error 404</p>
      <h1>Page not found</h1>
      <p class="message">
        The requested page could not be found. Return to RentConverter to choose
        a calculator or start a new rent conversion.
      </p>
      <a href="/">Go to RentConverter</a>
    </main>
  </body>
</html>
